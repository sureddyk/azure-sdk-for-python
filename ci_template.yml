      continueOnError: true
      displayName: 'SAST/CodeQuality - SonarQube set heapsize'
      inputs:
        script: "echo '##vso[task.prependpath]/adoagent/goldenversions/redhatopenjdk-17/bin'\necho \"##vso[task.setvariable variable=JAVA_HOME]/adoagent/goldenversions/redhatopenjdk-17\"\njavac -version    \necho \"##vso[task.setvariable variable=SONAR_SCANNER_OPTS;]-Xmx16384m\"\npullRequestId=$SYSTEM_PULLREQUEST_PULLREQUESTID\nif [ -n \"$pullRequestId\" ]; then\n   echo \"Valid pull request ID: $pullRequestId\"\n   echo \"##vso[task.setvariable variable=current_branch;]\"\nelse\n   echo \"No valid pull request found.\"\n   full_ref=\"$(Build.sourceBranch)\"\n   echo $full_ref\n   branch_name=\"sonar.branch.name=${full_ref#refs/heads/}\" \n   echo \"##vso[task.setvariable variable=current_branch;]$branch_name\"\nfi      \n"
    - task: SonarQubePrepare@5.19.0
      displayName: 'SAST/CodeQuality - SonarQube Prepare'
      condition: and(succeeded(),or(eq(variables['build.sourceBranch'], 'refs/heads/develop'),contains(variables['build.sourceBranch'], 'refs/heads/release/'), eq(variables['build.sourceBranch'], 'refs/heads/main'), eq(variables['build.sourceBranch'], 'refs/heads/master'), eq(variables['Build.Reason'], 'PullRequest'),eq('False', true), and(eq('False', true),contains(variables['Build.sourceBranch'], 'refs/heads/hotfix/ecr')), and(contains(variables['Build.sourceBranch'], 'refs/heads/hotfix/'),not(contains(variables['Build.sourceBranch'], 'refs/heads/hotfix/ecr'))), eq(variables['build.sourceBranch'],'refs/heads/catalyst/main'), contains(variables['build.sourceBranch'],'refs/heads/catalyst/release/')))
