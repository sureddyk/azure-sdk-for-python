        script: "import json\nimport os\ndef update_json_file(file_path, failed_count, passed_count, skipped_count, finding):\n    # Check if the file already exists\n    try:\n        print(file_path)\n        with open(file_path, 'r') as file:\n            existing_data = json.load(file)\n            print('checkovScanSuccess True')\n            print('##vso[task.setvariable variable=checkovScanSuccess;isOutput=true]Yes')\n    except FileNotFoundError:\n        existing_data = None\n        print('##vso[task.setvariable variable=checkovScanSuccess;isOutput=true]No')\n        print('checkovScanSuccess False')\n\n    # If the file doesn't exist or is empty, create it with the default JSON data\n    if existing_data is None or not existing_data:\n        for i, finding_item in enumerate(finding):\n            if isinstance(finding_item, dict):\n               code_block = finding_item.get(\"code_block\", [])\n               if isinstance(code_block, list):\n                 cleaned_blocks = []\n                 for block in code_block:\n                     if isinstance(block, list) and len(block) == 2:\n                          line_num = str(block[0])\n                          line_text = block[1] if isinstance(block[1], str) else str(block[1])\n                          cleaned_blocks.append([line_num, line_text])\n                     elif isinstance(block, dict):\n                          cleaned_blocks.append({str(k): str(v) for k, v in block.items()})\n                     else:\n                          cleaned_blocks.append(str(block))\n                 finding[i][\"code_block\"] = cleaned_blocks                    \n\n        new_data = {\n          \"summary\": {\n              \"failedCount\": failed_count,\n              \"passedCount\": passed_count,\n              \"skippedCount\": skipped_count\n          },\n            \"findings\": finding\n          }\n\n        \n    else:\n        # If the file exists, update the values\n        if \"summary\" in existing_data and \"failedCount\" in existing_data[\"summary\"]:\n            existing_data[\"summary\"][\"failedCount\"] =  existing_data[\"summary\"][\"failedCount\"] + int(failed_count)\n        else:\n            existing_data[\"summary\"][\"failedCount\"] = failed_count\n\n        if \"summary\" in existing_data and \"passedCount\" in existing_data[\"summary\"]:\n            existing_data[\"summary\"][\"passedCount\"] = existing_data[\"summary\"][\"passedCount\"] + int(passed_count)\n        else:\n            existing_data[\"summary\"][\"passedCount\"] = passed_count\n\n        if \"summary\" in existing_data and \"skippedCount\" in existing_data[\"summary\"]:\n            existing_data[\"summary\"][\"skippedCount\"] = existing_data[\"summary\"][\"skippedCount\"] + int(skipped_count)\n        else:\n            existing_data[\"summary\"][\"skippedCount\"] = skipped_count\n\n        if \"findings\" in existing_data:\n            if isinstance(existing_data[\"findings\"], list):\n                 if isinstance(finding, list):\n                    existing_data[\"findings\"].extend(finding)\n                 else:\n                    existing_data[\"findings\"].append(finding)\n            else:\n                existing_data[\"findings\"] = finding if isinstance(finding, list) else [finding]\n        else:\n            existing_data[\"findings\"] = finding if isinstance(finding, list) else [finding]\n\n        for finding_item in (existing_data.get(\"findings\", [])):\n\n            if isinstance(finding_item, dict):\n\n                code_block = finding_item.get(\"code_block\", [])\n                if isinstance(code_block, list):\n\n                      cleaned_blocks = []\n                      for block in code_block:\n                          if isinstance(block, list) and len(block) == 2:\n                              line_num = str(block[0])\n                              line_text = block[1] if isinstance(block[1], str) else str(block[1])\n                              cleaned_blocks.append([line_num, line_text])\n                          elif isinstance(block, dict):\n                              cleaned_blocks.append({str(k): str(v) for k, v in block.items()})\n                          else:\n                              cleaned_blocks.append(str(block))\n                      finding_item[\"code_block\"] = cleaned_blocks \n        new_data = existing_data\n\n    # Write the updated or new data to the file\n    with open(file_path, 'w') as file:\n        json.dump(new_data, file, indent=2)\n    print(f\"File '{file_path}' updated successfully,checkovScanSuccess is True\")\n    print('##vso[task.setvariable variable=checkovScanSuccess;isOutput=true]Yes')\n\n\nos.chdir(\"$(Build.ArtifactStagingDirectory)\")\nfile_path = '$(CHECKOV_PATH)'.replace('/','\\/')\nfile_path = file_path.replace('.','\\.')\nprint(f'##vso[task.setvariable variable=FILE_PATH;]{file_path}')\ninputdata = open('checkov-results/results_json.json', 'r')\ndata = json.load(inputdata)\ntry:\n  passedCountInt = int(data[\"summary\"][\"passed\"])\n  failedCountInt = int(data[\"summary\"][\"failed\"])\n  skippedCountInt = int(data[\"summary\"][\"skipped\"])\n  failedCheck = []\n  skippedcheck =[]\n\n  try:\n    failedCheck = data[\"results\"][\"failed_checks\"]\n  except:\n    failedCheck = []\n    pass\n\n  try:\n    skippedcheck = data[\"results\"][\"skipped_checks\"]\n  except:\n    skippedcheck = []\n    pass\n\n  try:\n    failedCheck = failedcheck + skippedcheck\n  except:\n    pass\n\n  print(f'##vso[task.setvariable variable=PASSED_COUNT;]{data[\"summary\"][\"passed\"]}')\n  print(f'##vso[task.setvariable variable=FAILED_COUNT;]{data[\"summary\"][\"failed\"]}')\n  print(f'##vso[task.setvariable variable=SKIPPED_COUNT;]{data[\"summary\"][\"skipped\"]}')\n  update_json_file(\"checkov_helm.json\", failedCountInt, passedCountInt, skippedCountInt, failedCheck)\n  \nexcept KeyError:\n  print(f'##vso[task.setvariable variable=PASSED_COUNT;]-')\n  print(f'##vso[task.setvariable variable=FAILED_COUNT;]-')\n  print(f'##vso[task.setvariable variable=SKIPPED_COUNT;]-')\n  update_json_file(\"checkov_helm.json\", -1, -1, -1, [])\n  pass\n\ntry:\n  print(f'##vso[task.setvariable variable=SKIPPED_CHECK;]{data[\"results\"][\"skipped_checks\"][0][\"check_id\"]}')\nexcept:\n  print(f'##vso[task.setvariable variable=SKIPPED_CHECK;] No Skipped Checks')\n  pass\n"
