    - task: CmdLine@2
      continueOnError: false
      condition: or( eq(variables['System.CollectionUri'], 'https://dev.azure.com/sc-ado/'),eq(variables['System.CollectionUri'], 'https://dev.azure.com/sc-ado-qa/'),eq(variables['System.CollectionUri'], 'https://ado.global.standardchartered.com/sc-ado-op/'),eq(variables['System.CollectionUri'], 'https://ado.global.standardchartered.com/sc-ado-qa-op/'),eq(variables['System.CollectionUri'], 'https://ado.global.standardchartered.com/sc-ado-stg-op/'))
      inputs:
