          stageName=$(echo "dev" | tr '[:upper:]' '[:lower:]')

          echo "stageName: $stageName"

          if [[ "$stageName" == *"prod"* || "$stageName" == *"dr"* ]]

          then
            if [[ "$stageName" == *"rollback"* && "$fallBackArtifactoryRollbackStage" != "YES" ]]
            then
              ARTIFACTORY_URL='https://production.artifactory.global.standardchartered.com'
              ARTIFACTORY_SERVICE_CONNECTION='Jfrog Artifactory New Production V2'
