  - job: Record_Deployment
    dependsOn:
    - openshift
    pool:
      name: "sc-linux"
    displayName: Record Deployment
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      condition: false
      inputs:
        repository: none
    - task: record-deployment@1.0.8067642
      timeoutInMinutes: 30
      displayName: Record Deployment
      inputs:
        environmentName: 51041-dr
        environmentDisplayName: 51041-DR_OCP
        deploymentAttributes: >
          deploymentStackName=openshift

          agentName=sc-linux
  - job: confirm_deployment_success
    displayName: Confirm Deployment Successful
    timeoutInMinutes: 90
    pool:
      name: server
    dependsOn:
    - Record_Deployment
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 0
      inputs:
        notifyUsers: '[sc-ado]\ADO-51041-PSS-review'
        instructions: Wait for UVT Completion
  - job: evaluator
    dependsOn:
    - confirm_deployment_success
    pool:
      name: "sc-linux"
    condition: failed('confirm_deployment_success')
    displayName: Evaluator
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      condition: false
      inputs:
        repository: none
    - task: CmdLine@2
      name: stage
      displayName: Setting Rollback Status
      inputs:
        script: |
          # Define variables
          projectId="$SYSTEM_TEAMPROJECTID"
          buildId="$BUILD_BUILDID"

          # Determine the stage ID
          uri="$(System.CollectionUri)$(System.TeamProject)/_apis/build/builds/$buildId/timeline?api-version=6.0"

          # functions
          get_webclient() {
            curl -s -X GET -H "Content-Type: application/json" -H "Authorization: Bearer $(System.AccessToken)" "$1"
          }
          timelineResponse=$(get_webclient "$uri")

          sleep 10

          stageID=$(echo "$timelineResponse" | jq -r '.records[] | select(.identifier == "$(System.StageName)") | .id')
          echo "Stage Id: $stageID"

          # Now we can get the approval details
          queryURI="$(System.CollectionUri)_apis/Contribution/HierarchyQuery/project/$projectId?api-version=6.1-preview.1"
          payload="{\"contributionIds\":[\"ms.vss-build-web.checks-panel-data-provider\"],\"dataProviderContext\":{\"properties\":{\"buildId\":\"$buildId\",\"stageIds\":\"$stageID\",\"checkListItemType\":2,\"sourcePage\":{\"url\":\"$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$buildId&view=results\",\"routeId\":\"ms.vss-build-web.ci-results-hub-route\",\"routeValues\":{\"project\":\"$(System.TeamProject)\",\"viewname\":\"build-results\",\"controller\":\"ContributedPage\",\"action\":\"Execute\",\"serviceHost\":\"594961c2-ead9-4053-bef9-52498ac587fd (sdl)\"}}}}}"
          echo "Payload: $payload"

          # # Make the HTTP request to get approval details
          queryResponse=$(curl -s -H "Authorization: Bearer $(System.AccessToken)" -H "Content-Type: application/json" -X POST -d "$payload" "$queryURI")

          approval=$(echo "$queryResponse" | jq -c ".dataProviders[\"ms.vss-build-web.checks-panel-data-provider\"][0].manualValidations")
          # approverEmail=$(echo "$queryResponse" | jq -r ".dataProviders[\"ms.vss-build-web.checks-panel-data-provider\"][0].manualValidations[0].steps[0].actualApprover.uniqueName")
          # approverName=$(echo "$queryResponse" | jq -r ".dataProviders[\"ms.vss-build-web.checks-panel-data-provider\"][0].manualValidations[0].steps[0].actualApprover.displayName")
          approvalComment=$(echo "$approval" | jq -r '.[] | select(.jobName=="Confirm Deployment Successful").steps[0].comment')
          approvalStatusID=$(echo "$approval" | jq -r '.[] | select(.jobName=="Confirm Deployment Successful").status')
          echo "Status:  $approvalStatus $approvalStatusID"
          echo "Comment:  $approvalComment"

          if [ "$approvalStatusID" -eq 8 ]; then
            approvalStatus="Rejected"
            echo "##vso[task.setvariable variable=STATUS;isOutput=true]$approvalStatus"
            echo "##vso[task.setvariable variable=COMMENTS;isOutput=true]$approvalComment"
            echo "##vso[task.complete result=Succeeded;]"
          fi

          if [ "$approvalStatusID" -eq 32 ]; then
            approvalStatus="Timeout"
            echo "##vso[task.setvariable variable=STATUS;isOutput=true]$approvalStatus"
            echo "##vso[task.logissue type=warning]Manual Validation job timeout"
            echo "##vso[task.complete result=SucceededWithIssues;]"
          fi
  - job: update_release
    pool:
      name: "sc-linux"
    displayName: Update Release Status
    dependsOn:
    - Record_Deployment
    - confirm_deployment_success
    condition: and(succeeded(), ne(False, True))
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      condition: false
      inputs:
        repository: none
    - task: verify-pipeline-info@1.0.8067642
      name: verifyPipelineInfo
      displayName: "Update Release Status"
      inputs:
        releaseId: 10444193
        subComponentId: ''
        stage: PRODUCTION
        dataStoreServiceConnectionId: "dataStore"
        adoServiceConnectionId: "releaseControls"
        snowDataServiceConnection: "snowdata"
        buildStackName: generic
        deployStackName: openshift
        proxyUrl: "$(http_proxy)"
  - job: Build_Metrics
    condition: in(dependencies.update_release.result, 'Succeeded', 'SucceededWithIssues', 'Skipped', 'Failed', 'Canceled')
    displayName: Record Build Metrics
    pool:
      name: sc-linux
    dependsOn:
    - update_release
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      condition: false
      inputs:
        repository: none
    - task: get-secrets@1.0.8067642
      name: get_Secrets
      displayName: Retrieve Secrets
      inputs:
        secretConfigs: >-
          [
            {
              "secretName": "os_token",
              "secretValue": "secret1"
            },
            {
              "secretName": "az_token",
              "secretValue": "secret2"
            }
          ]
        vaultServiceConnectionId: ''
        secretsServiceConnectionId: ADO-DataLake
        retrieveAppSecret0: Y
        adoManagedVault: ''
        secretType: ''
        vaultLoginPath: $(vaultLoginPath)
    - task: record-metrics-data@1.0.670369
      timeoutInMinutes: 10
      continueOnError: true
      inputs:
        dataLakeServiceConnectionId: 'ADO-DataLake'
        DataLakeConnection: $(get_Secrets.os_token)
        AzConnection: $(get_Secrets.az_token)
        StackName: generic
        Source: "governed-templates"
        DeployStackName: openshift
        IsDevFactory: False
        ReleaseId: 10444193
