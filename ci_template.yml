      inputs:
        reportType: "cloc"
    - task: PublishSecurityHtml@1
      continueOnError: true
      displayName: Repo Dash Deck - Publish Report
      condition: and(succeededOrFailed(),or(contains(variables['Build.sourceBranch'], 'refs/heads/hotfix/'),contains(variables['build.sourceBranch'], 'refs/heads/release/'), eq(variables['build.sourceBranch'], 'refs/heads/main'), eq(variables['build.sourceBranch'], 'refs/heads/master'), eq(variables['build.sourceBranch'],'refs/heads/catalyst/main'), contains(variables['build.sourceBranch'],'refs/heads/catalyst/release/')))
      inputs:
        reportDir: "cloc-report.html"
        tabName: ..Cloc-Report
    - task: PublishBuildArtifacts@1
      condition: and(succeededOrFailed(),or(contains(variables['Build.sourceBranch'], 'refs/heads/hotfix/'),contains(variables['build.sourceBranch'], 'refs/heads/release/'), eq(variables['build.sourceBranch'], 'refs/heads/main'), eq(variables['build.sourceBranch'], 'refs/heads/master'), eq(variables['build.sourceBranch'],'refs/heads/catalyst/main'), contains(variables['build.sourceBranch'],'refs/heads/catalyst/release/')))
      continueOnError: true
      inputs:
        PathtoPublish: "$(System.DefaultWorkingDirectory)/cloc-report.json"
        ArtifactName: "CodeAnalysisLogs"
        publishLocation: "Container"
      displayName: Repo Dash Deck - Publish Artifacts
    - task: PublishBuildArtifacts@1
      condition: and(succeededOrFailed(),or(contains(variables['Build.sourceBranch'], 'refs/heads/hotfix/'),contains(variables['build.sourceBranch'], 'refs/heads/release/'), eq(variables['build.sourceBranch'], 'refs/heads/main'), eq(variables['build.sourceBranch'], 'refs/heads/master'), eq(variables['build.sourceBranch'],'refs/heads/catalyst/main'), contains(variables['build.sourceBranch'],'refs/heads/catalyst/release/')))
      continueOnError: true
      inputs:
        PathtoPublish: "$(System.DefaultWorkingDirectory)/cloc-unsupported-language.json"
        ArtifactName: "DataStore"
        publishLocation: "Container"
      displayName: Repo Dash Deck - Publish Artifacts (UnSupported Languages)
    - task: CmdLine@2
      continueOnError: true
      displayName: Secrets Scanning - GitLeaks Scan
      inputs:
        script: "echo \"************************************************************* GITLEAKS VERSION 7 ************************************************************** \"  \necho Reponame : $(Build.Repository.Name)  \necho Project Name : $(System.TeamProject)  \nrm -rf $(Agent.HomeDirectory)/workspace\nrm -rf $(System.DefaultWorkingDirectory)/leaks_report.json\nmkdir $(Agent.HomeDirectory)/workspace     \ncp  \"$(System.DefaultWorkingDirectory)/gitleaks-config/rules.toml\" $(Agent.HomeDirectory)/workspace/rules.toml\ncp  \"$(System.DefaultWorkingDirectory)/gitleaks-config/$(System.TeamProject)/$(Build.Repository.Name)/gitleaks.toml\" $(Agent.HomeDirectory)/workspace/gitleaks.toml\ncd $(Agent.HomeDirectory)/workspace\ncd /adoagent/sec-ops/gitleaks/\n./gitleaks-linux-amd64 --version      \nfunction gitleaks_scan() {\nif [ -f $(Agent.HomeDirectory)/workspace/gitleaks.toml ]; \nthen      \necho \"Additional File is exist in gitleaks_scan \"      \necho \"##vso[task.logissue type=warning] Leaks are whitelisted with additional file.\"\n./gitleaks-linux-amd64 -p $(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/ -c $(System.DefaultWorkingDirectory)/gitleaks-config/rules.toml --additional-config=$(System.DefaultWorkingDirectory)/gitleaks-config/$(System.TeamProject)/$(Build.Repository.Name)/gitleaks.toml  --no-git --redact --format=json --report=$(System.DefaultWorkingDirectory)/leaks_report.json --leaks-exit-code=0\necho \"##vso[task.setvariable variable=gitleaks_timeout]No\"\necho \"##vso[task.setvariable variable=WHITE_LIST_FILE;]Yes\"\nelse       \necho \"Additional File is not exist in gitleaks_scan \"\n./gitleaks-linux-amd64 -p $(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/ -c $(System.DefaultWorkingDirectory)/gitleaks-config/rules.toml --no-git --redact --format=json --report=$(System.DefaultWorkingDirectory)/leaks_report.json --leaks-exit-code=0\n  echo \"##vso[task.setvariable variable=gitleaks_timeout]No\"\n  echo \"##vso[task.setvariable variable=WHITE_LIST_FILE;]No\"  \nfi  \n}          \nif [[ $(System.CollectionUri) == 'https://dev.azure.com/sc-ado-stg/' ]];\nthen          \n  timeout_seconds=\"7200\"\n  export -f gitleaks_scan\n  timeout \"${timeout_seconds}s\" bash -c gitleaks_scan     \nelse         \n   timeout_seconds=\"600\"\n   export -f gitleaks_scan\n   timeout \"${timeout_seconds}s\" bash -c gitleaks_scan\nfi  \ntimeout_exit_code=$?\nif [ $timeout_exit_code -eq 124 ]; then\n    folder_size_bytes=$(du -s \"$(System.DefaultWorkingDirectory)/$(Build.Repository.Name)\" | awk '{print $1}')\n    folder_size_mb=$(echo \"scale=2; $folder_size_bytes / 1024\" | bc)\n    echo \"Size of the Repo $(Build.Repository.Name) is: ${folder_size_mb} MB\"\n    echo \"##vso[task.logissue type=warning] Gitleaks full scan timeout,Repo will be scanned for latest commit.\"\n    echo \"##vso[task.setvariable variable=timeout]Yes\"                            \nfi\n"
    - task: CmdLine@2
      condition: and(succeeded(), ne(variables['gitleaks_timeout'], 'No'))
      displayName: Secrets Scanning - GitLeaks-Latest Commit Scan
      inputs:
        script: "function gitleaks_scan_latestcommit() {\n    cd $(Agent.HomeDirectory)/workspace\n    if [ -f $(Agent.HomeDirectory)/workspace/gitleaks.toml ]; \n    then      \n    echo \"Additional File is exist in gitleaks_scan \"      \n    echo \"##vso[task.logissue type=warning] Leaks are whitelisted with additional file.\"\n    cd /adoagent/sec-ops/gitleaks/\n    ./gitleaks-linux-amd64 -p $(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/ -c $(System.DefaultWorkingDirectory)/gitleaks-config/rules.toml --additional-config=$(System.DefaultWorkingDirectory)/gitleaks-config/$(System.TeamProject)/$(Build.Repository.Name)/gitleaks.toml   --commit=latest  --debug --redact --format=json --report=$(System.DefaultWorkingDirectory)/leaks_report.json --leaks-exit-code=0\n    echo \"##vso[task.setvariable variable=gitleaks_timeout]No\"\n    echo \"##vso[task.setvariable variable=WHITE_LIST_FILE;]Yes\"              \n    else       \n    echo \"Additional File is not exist in gitleaks_scan \"\n    cd /adoagent/sec-ops/gitleaks/\n    ./gitleaks-linux-amd64 -p=$(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/ -c $(System.DefaultWorkingDirectory)/gitleaks-config/rules.toml  --commit=latest --debug --redact --format=json --report=$(System.DefaultWorkingDirectory)/leaks_report.json --leaks-exit-code=0\n    echo \"##vso[task.setvariable variable=gitleaks_timeout]No\"\n    echo \"##vso[task.setvariable variable=WHITE_LIST_FILE;]No\"  \n    fi\n}\n   timeout_seconds=\"600\"\n   export -f gitleaks_scan_latestcommit\n   timeout \"${timeout_seconds}s\" bash -c gitleaks_scan_latestcommit\n\ntimeout_exit_code=$?\nif [ $timeout_exit_code -eq 124 ]; then            \n    echo \"##vso[task.logissue type=warning] Gitleaks latest commit scan timeout.\"\n    echo \"##vso[task.setvariable variable=timeout]Yes\"                            \nfi\n"
    - task: gitleaks-report@1
      condition: and(succeeded(), eq(variables['gitleaks_timeout'], 'No'))
      displayName: Secrets Scanning - Prepare Report
    - task: GenerateHtmlReport@1
      continueOnError: true
      condition: and(succeeded(), ne('gitleaks', ''))
      displayName: "Generate Secops HTML report"
      inputs:
        SecOpsTool: gitleaks
        JsonFilePath: $(System.DefaultWorkingDirectory)/leaks_report.json
        CustomCiId: ''
        NexusIQ: "NexusServiceConnection"
        QualysESConnection: "qualysESConnection"
        SnowdataConnection: "snowdata"
    - task: Publish-Summary-Report@1
      continueOnError: true
      condition: succeeded()
      displayName: "Publish Secops Summary HTML report"
      inputs:
        reportDir: $(Build.ArtifactStagingDirectory)/gitleaks_summary_report_$(Build.BuildId).html
    - task: PublishSecurityHtml@1
      condition: and(succeeded(), eq(variables['gitleaks_timeout'], 'No'))
