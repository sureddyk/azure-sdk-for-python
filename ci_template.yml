# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
    - main
    - hotfix/*
    - release/*
    - restapi*
  paths:
    include:
    - sdk/ml/
    - scripts/
    - sdk/core/

pr:
  branches:
    include:
    - main
    - feature/*
    - hotfix/*
    - release/*
    - restapi*
  paths:
    include:
    - sdk/ml/
    - sdk/core/

pool:
  vmImage: 'macOS-latest'   # Options: macOS-14, macOS-13, macOS-12, macOS-latest

steps:
- script: |
    echo "Running on macOS agent"
    sw_vers   # Shows macOS version
    uname -a  # Shows system info
  displayName: 'System info'

# Example: Install dependencies (Node.js, Python, etc.)
- task: UseNode@1
  inputs:
    version: '18.x'

- script: |
    node -v
    npm install
    npm test
  displayName: 'Run Node.js tests'

# Example: Python test
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
    addToPath: true

- script: |
    python --version
    pip install pytest
    pytest --maxfail=1 --disable-warnings -q
  displayName: 'Run Python tests'
