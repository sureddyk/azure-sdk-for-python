    - name: Blade_Config_Repo
      value: 50665-blade-k8s-config
    - name: Rules_Config_Repo
      value: 51527-rules-k8s-config
    steps:
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: gitleaksConfig
        fetchTags: false
    - task: 6d15af64-176c-496d-b583-fd2ae21d4df4@1
      inputs:
        repository: self
        fetchDepth: 0
        fetchTags: false
    - task: CmdLine@2
      continueOnError: true
      displayName: Repo Dash Deck - Scanning
      condition: and(succeededOrFailed(),or(contains(variables['Build.sourceBranch'], 'refs/heads/hotfix/'),contains(variables['build.sourceBranch'], 'refs/heads/release/'), eq(variables['build.sourceBranch'], 'refs/heads/main'), eq(variables['build.sourceBranch'], 'refs/heads/master'),eq(variables['build.sourceBranch'],'refs/heads/catalyst/main'), contains(variables['build.sourceBranch'],'refs/heads/catalyst/release/')))
      inputs:
        script: "cd /adoagent/sec-ops/cloc\nls -lrt\n./cloc.pl $(System.DefaultWorkingDirectory)/$(Build.Repository.Name)/ --json  --report-file=$(System.DefaultWorkingDirectory)/cloc-report.json                  \nls -lrt\n"
    - task: security-report@1
      continueOnError: true
      displayName: Repo Dash Deck - Generate Report
